name: Firmware build

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cppcheck

      # Ubuntu's own archives don't carry clang-23 yet; apt.llvm.org's
      # bootstrap script does, and installs it as clang-23 (matches the
      # local dev machine's own clang-23, see firmware/Makefile).
      - name: Install clang-23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Build firmware
        run: make

      - name: Run static analyzer
        run: make analyze

      - name: Run firmware tests
        run: make test

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: fanny-firmware
          path: |
            firmware/build/fanny.elf
            firmware/build/fanny.bin
