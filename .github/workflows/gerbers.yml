name: Gerbers

on:
  push:
    paths:
      - "hardware/kicad/fan_controller.kicad_pcb"
      - ".github/workflows/gerbers.yml"
  pull_request:
    paths:
      - "hardware/kicad/fan_controller.kicad_pcb"
      - ".github/workflows/gerbers.yml"
  workflow_call:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.7
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Export gerbers and drill file
        run: |
          mkdir -p hardware/gerbers/export
          kicad-cli pcb export gerbers --board-plot-params \
            -o hardware/gerbers/export hardware/kicad/fan_controller.kicad_pcb
          kicad-cli pcb export drill \
            -o hardware/gerbers/export hardware/kicad/fan_controller.kicad_pcb

      - name: Copy BOM
        run: cp hardware/bom.csv hardware/gerbers/export/bom.csv

      - name: Zip gerbers
        run: |
          apt-get update && apt-get install -y zip
          cd hardware/gerbers/export
          zip -r ../fanny-gerbers.zip .

      - name: Upload gerbers
        uses: actions/upload-artifact@v4
        with:
          name: fanny-gerbers
          path: hardware/gerbers/fanny-gerbers.zip
