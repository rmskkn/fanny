name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/firmware.yml

  gerbers:
    uses: ./.github/workflows/gerbers.yml

  release:
    needs: [ci, gerbers]
    runs-on: ubuntu-latest
    steps:
      # license texts must ship with the binaries; COPYING.LGPL3 lives in the libopencm3 submodule
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: fanny-firmware
          path: firmware/build

      - uses: actions/download-artifact@v4
        with:
          name: fanny-gerbers
          path: hardware/gerbers

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/fanny.elf
            firmware/build/fanny.bin
            hardware/gerbers/fanny-gerbers.zip
            hardware/case/fan_controller_tray.stl
            hardware/case/fan_controller_cover.stl
            LICENSE
            LICENSE-GPL-3.0
            firmware/Drivers/libopencm3/COPYING.LGPL3
