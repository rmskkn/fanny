name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.7
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc
        run: |
          apt-get update
          apt-get install -y gcc-arm-none-eabi zip

      - name: Build firmware
        run: make

      - name: Run firmware tests
        run: make test

      - name: Export gerbers and drill file
        run: |
          mkdir -p hardware/gerbers/export
          kicad-cli pcb export gerbers --board-plot-params \
            -o hardware/gerbers/export hardware/kicad/fan_controller.kicad_pcb
          kicad-cli pcb export drill \
            -o hardware/gerbers/export hardware/kicad/fan_controller.kicad_pcb

      - name: Copy BOM
        run: cp hardware/bom.csv hardware/gerbers/export/bom.csv

      - name: Zip gerbers
        run: |
          cd hardware/gerbers/export
          zip -r ../fanny-gerbers.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/fanny.elf
            firmware/build/fanny.bin
            hardware/gerbers/fanny-gerbers.zip
